<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FX Convert • Currency</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src https://open.er-api.com https://api.frankfurter.dev; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<style>
:root{
  /* v10.38 — the app is dark-only: tell the UA, so native control
     chrome (the custom card's two select popups above all) and
     scrollbars render in the platform's dark theme instead of
     flashing a light one */
  color-scheme:dark;
  --bg:#081410;
  --bg-deep:#060f0c;
  --teal:#3ee6c8;
  --plum:#b04e90;
  --rose-light:#c9659f; /* lightest rose from Update Rates button gradient */
  --ink:#eaf6f2;
  --mut:#7fa89e;
  --dim:#4f756c;
  --card:#0c201a;
  --card-edge:#1c3a32;
  --live:#43d98a;
  --bad:#ff5f66;
}
*{margin:0;padding:0;box-sizing:border-box}
/* iOS Safari double-tap zoom guard: rapid tapping on controls — the
   calculator pad above all — is exactly the gesture that triggers it;
   manipulation removes the zoom shortcut on these elements without
   touching page pinch-zoom */
/* v10.36: .ccy joined the guard — a select is a tappable control,
   extending the v10.32 scope by its own rule */
.btn,.nav,.swap,.calc-btn,.calc-pop button,.ccy{touch-action:manipulation}
html,body{min-height:100%}
body{
  font-family:"Avenir Next","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  color:var(--ink);
  background:
    radial-gradient(1100px 620px at 18% -12%, rgba(62,230,200,.10), transparent 60%),
    radial-gradient(900px 520px at 88% 112%, rgba(176,78,144,.07), transparent 60%),
    linear-gradient(180deg, var(--bg) 0%, var(--bg-deep) 55%, var(--bg) 100%);
  min-height:100vh;
  display:flex;flex-direction:column;
  overflow-x:hidden;
}
/* static grain overlay */
.grain{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:60;opacity:.055}

/* ---------- header ---------- */
header{
  display:flex;align-items:center;gap:18px;
  padding:13px clamp(16px,4vw,44px) 10px;
}
header .logo{flex:0 0 auto;display:block}
.header-brand{
  font-size:clamp(22px,3.4vw,32px);
  font-weight:600;letter-spacing:.14em;text-transform:uppercase;
  color:var(--ink);
}
.header-brand .tick{color:var(--teal)}
@media (max-width:640px){.header-brand{font-size:clamp(20px,3vw,26px)}}

/* lens shimmer: a light band sweeps across the shield on a loop */
.logo .shine{
  animation:shimmer 3.8s ease-in-out infinite;
}
@keyframes shimmer{
  0%{transform:translateX(-34px);opacity:0}
  12%{opacity:.9}
  48%{transform:translateX(38px);opacity:.9}
  60%,100%{transform:translateX(38px);opacity:0}
}
@media (prefers-reduced-motion:reduce){
  .logo .shine{animation:none;opacity:.55;transform:translateX(4px)}
}

/* ---------- controls / status ---------- */
.controls{
  display:flex;align-items:center;gap:16px;flex-wrap:wrap;
  padding:5px clamp(16px,4vw,44px) 9px;
}
.btn{
  appearance:none;border:1px solid #5e1d47;
  border-radius:10px;
  color:var(--ink);font:inherit;font-size:14px;font-weight:600;letter-spacing:.05em;
  padding:10px 22px;cursor:pointer;
  background-color:#963a74;
  background-image:
    linear-gradient(165deg, #c9659f 0%, #b04e90 45%, #8a305f 100%);
  box-shadow:0 0 0 1px rgba(192,101,159,.12), 0 8px 22px rgba(0,0,0,.35), inset 0 1px 0 rgba(232,196,106,.14);
  transition:filter .15s ease;
}
.btn:hover:not(:disabled){filter:brightness(1.12)}
.btn:disabled{cursor:default;color:var(--mut);filter:saturate(.5) brightness(.8)}
.status{
  display:inline-flex;align-items:center;gap:8px;
  font-size:13.5px;color:var(--mut);min-height:1.2em;
}
.status.err{color:var(--bad)}

/* ---------- carousel stage ---------- */
.stage{
  position:relative;flex:1 0 auto;
  min-height:520px;
  overflow:hidden;
  margin:0 clamp(10px,3vw,34px) 4px;
}
/* gem-cut beacon: pinned to the stage's top centre — the same axis
   layout() centres the active card on — and pointing down at it.
   pointer-events:none keeps it clear of every click beneath it */
.beacon{
  position:absolute;top:8px;left:50%;transform:translateX(-50%);
  z-index:25;pointer-events:none;
}
.chevron{display:block;animation:bob 2.6s ease-in-out infinite}
@keyframes bob{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(5px)}
}
.card{
  position:absolute;top:50%;left:0;
  width:min(340px,84vw);
  transform:translate(-200px,-50%);
  background:
    linear-gradient(175deg, rgba(62,230,200,.05), transparent 40%),
    var(--card);
  border:1px solid var(--card-edge);
  border-radius:16px;
  padding:24px 24px 26px;
  box-shadow:0 18px 50px rgba(0,0,0,.5), inset 0 1px 0 rgba(62,230,200,.08);
  will-change:transform;
  transition:none; /* armed after first paint so the load never slides */
}
.stage.armed .card{transition:transform .4s cubic-bezier(.2,.7,.3,1)}
.stage.rm .card{transition:none !important}
.stage:focus-visible{outline:1px solid var(--teal);outline-offset:-1px;border-radius:4px}
.pair{display:flex;align-items:baseline;gap:10px;justify-content:center;flex-wrap:wrap}
.pair .code{
  font-size:24px;font-weight:700;letter-spacing:.06em;color:var(--teal);
}
.pair .name{font-size:12.5px;color:var(--mut);letter-spacing:.04em}
.pair.to .code{color:var(--plum)}
.swap{
  display:block;margin:10px auto;
  appearance:none;background:none;border:1px solid var(--card-edge);
  border-radius:50%;width:44px;height:44px;
  color:var(--teal);font-size:20px;line-height:1;cursor:pointer;
  transition:color .15s ease,border-color .15s ease;
}
.swap:hover{color:var(--plum);border-color:var(--plum)}
.io{margin-top:18px;border-top:1px solid var(--card-edge);padding-top:16px}
.lbl{font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--dim);margin-bottom:6px}
.inrow{display:flex;gap:8px}
.amt{
  flex:1;min-width:0;
  background:rgba(6,15,12,.75);
  border:1px solid var(--card-edge);border-radius:9px;
  color:var(--teal);font:inherit;font-size:20px;
  padding:10px 14px;outline:none;
  transition:border-color .15s ease;
}
.amt:focus{border-color:var(--teal)}
.amt::placeholder{color:#3a5c53}
/* v10.36 — custom card selects: they occupy the slot the static
   .code spans hold on legacy cards, so they mirror the code
   styling (24px bold, tracked, teal) and the plum flip for the to
   side, over transparent chrome. Native pickers take it from
   there. flex-wrap on .pair absorbs the longest names */
.pair .ccy{
  font-family:inherit;font-size:24px;font-weight:700;letter-spacing:.06em;
  color:var(--teal);background:none;border:none;
  cursor:pointer;max-width:100%;
}
.pair.to .ccy{color:var(--plum)}
.ccy:focus{outline:1px solid var(--teal);outline-offset:2px}
.calc-btn{
  appearance:none;flex:0 0 auto;width:46px;
  background:rgba(6,15,12,.6);border:1px solid var(--card-edge);border-radius:9px;
  color:var(--mut);cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:color .15s ease,border-color .15s ease;
}
.calc-btn:hover{color:var(--teal);border-color:var(--teal)}
.calc-msg{
  margin-top:6px;font-size:12.5px;color:var(--bad);letter-spacing:.02em;
}
/* quiet variant: for gentle guidance, not alarm — red stays
   reserved for the divide-by-zero message, the C key and the
   bad status dot, nothing else */
.calc-msg.hint{color:var(--mut)}
.out{
  margin-top:4px;font-size:30px;font-weight:600;color:var(--plum);
  min-height:40px;word-break:break-all;line-height:1.25;
}
.out.na{font-size:14px;font-weight:400;color:var(--bad)}
.pop-slot{position:relative;height:0}
.calc-pop{
  position:absolute;right:0;top:6px;z-index:40;
  display:grid;grid-template-columns:repeat(3,48px);gap:5px;
  background:#0e2620;border:1px solid var(--card-edge);border-radius:12px;
  padding:7px;box-shadow:0 16px 40px rgba(0,0,0,.55);
}
/* the pad's own display rule would otherwise outrank the [hidden]
   attribute's UA stylesheet, so a "closed" pad stayed visible
   while detached from its card: buttons dead, nothing dismissible */
.calc-pop[hidden]{display:none}
.calc-pop button{
  appearance:none;font:inherit;font-size:18px;
  background:rgba(62,230,200,.07);border:1px solid var(--card-edge);border-radius:8px;
  color:var(--ink);height:40px;cursor:pointer;
  transition:background-color .15s ease;
}
.calc-pop button:hover{background:rgba(62,230,200,.18)}
.calc-pop button.ok{color:var(--teal);font-weight:700}
.calc-pop button.cls{color:var(--bad);font-weight:700}

/* nav arrows */
.nav{
  position:absolute;top:50%;transform:translateY(-50%);z-index:30;
  appearance:none;width:46px;height:46px;border-radius:50%;
  background:rgba(12,32,25,.85);border:1px solid var(--card-edge);
  color:var(--teal);cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:color .15s ease,border-color .15s ease;
}
.nav:hover{color:var(--plum);border-color:var(--plum)}
.nav.prev{left:6px}
.nav.next{right:6px}
@media (max-width:560px){.nav{width:38px;height:38px}.nav.prev{left:2px}.nav.next{right:2px}}

/* ---------- footer ---------- */
footer{
  text-align:center;padding:13px 16px 30px;
  border-top:1px solid rgba(28,58,50,.6);
  margin-top:7px;
}
.gem{display:block;margin:0 auto 10px}
.sig{
  font-size:13px;font-style:normal;color:var(--mut);
  letter-spacing:.01em;
}
.maint{
  margin-top:4px;font-size:15.5px;color:var(--mut);letter-spacing:.01em;
}
/* v10.34 retired the maintainer line's link, orphaning every
   .maint a selector that used to live here; swept in the v10.35
   tidy. The .priv halves stay: the privacy line still links */
.priv a{text-decoration:none}
.priv a:hover{color:var(--teal)}
.priv{
  margin-top:6px;font-size:13px;color:var(--mut);letter-spacing:.01em;
}
.priv a{color:var(--mut)}
.dot{
  width:9px;height:9px;border-radius:50%;display:inline-block;
  background:#57756c;vertical-align:middle;flex:0 0 auto;
}
.dot.live{background:var(--live);box-shadow:0 0 6px rgba(67,217,138,.7)}
.dot.bad{background:var(--bad);box-shadow:0 0 6px rgba(255,95,102,.7)}
.dot.busy{background:#57756c}
.ver{font-size:12px;color:var(--rose-light);letter-spacing:.12em;margin-left:7px}

/* gold spark orbits the heart's edge in sporadic arcs, twinkling as it goes */
.orbiter{
  transform-box:fill-box;transform-origin:center;
  animation:orbit 9s cubic-bezier(.55,0,.35,1) infinite;
}
@keyframes orbit{
  0%{transform:rotate(0deg)}
  24%{transform:rotate(148deg)}
  36%{transform:rotate(148deg)}   /* linger */
  66%{transform:rotate(272deg)}
  78%{transform:rotate(272deg)}   /* linger */
  100%{transform:rotate(360deg)}
}
.spk{
  opacity:0;
  transform-box:fill-box;transform-origin:center;
  animation:twinkle var(--td,4.6s) linear infinite;
}
@keyframes twinkle{
  0%,54%{opacity:0;transform:scale(.25)}
  63%{opacity:1;transform:scale(1.35)}
  71%{opacity:.35;transform:scale(.9)}
  80%{opacity:1;transform:scale(1.15)}
  91%,100%{opacity:0;transform:scale(.25)}
}
@media (prefers-reduced-motion:reduce){
  .orbiter,.spk{animation:none}
  .spk{opacity:.45}
  .chevron{animation:none}
}
</style>
</head>
<body>

<!-- static grain overlay -->
<svg class="grain" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <filter id="grainF">
    <feTurbulence type="fractalNoise" baseFrequency="0.82" numOctaves="2" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
  </filter>
  <rect width="100%" height="100%" filter="url(#grainF)"/>
</svg>

<header>
  <!-- cat logo: face only, static pose, friendly spunk; whisker-free -->
  <svg class="logo" width="58" height="58" viewBox="0 0 64 64" aria-hidden="true">
    <defs>
      <linearGradient id="lensG" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#ffd0ea"/>

      </linearGradient>
      <linearGradient id="shineBand" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
        <stop offset=".5" stop-color="#ffffff" stop-opacity=".95"/>
        <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>

    <path d="M39.5 19 Q44 17.5 49 20.5" fill="none" stroke="#1f9e86" stroke-width="2" stroke-linecap="round"/>
    <!-- sunglasses: Oil Rig-style wraparound — one continuous rectangular
         shield with chamfered corners, tapering outward past the temples;
         no nose gap, fully opaque lens, nothing behind it -->
    <path d="M7.5 26.5 L12.5 24 L51.5 24 L56.5 26.5 L56.5 32.5 L50.5 35.5 L13.5 35.5 L7.5 32.5 Z" fill="url(#lensG)"/>
    <!-- the slick bit: a light band sweeping across the whole shield -->
    <g clip-path="url(#lensClip)">
      <g transform="rotate(12 32 28)">
        <rect class="shine" x="18" y="14" width="9" height="30" fill="url(#shineBand)"/>
      </g>
    </g>
    <!-- frame: single plum outline around the shield, temple arms sweeping back -->
    <path d="M7.5 26.5 L12.5 24 L51.5 24 L56.5 26.5 L56.5 32.5 L50.5 35.5 L13.5 35.5 L7.5 32.5 Z" fill="none" stroke="#b04e90" stroke-width="2.4" stroke-linejoin="round"/>
    <path d="M8 29 L2.5 27" stroke="#b04e90" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M56 29 L61.5 27" stroke="#b04e90" stroke-width="2.2" stroke-linecap="round"/>

    <path d="M32 41.5 L29.2 39 L34.8 39 Z" fill="#b04e90"/>
    <!-- the grin: open smile with a flat-toothed band (no fangs) -->
    <path d="M21.5 45 Q32 57 42.5 45 Z" fill="#0a1a16"/>
    <path d="M23 45.7 Q32 48.6 41 45.7 L40.6 47.4 Q32 50.3 23.4 47.4 Z" fill="#ffffff"/>
    <path d="M27 46.4 L27.3 48.7 M32 47.1 L32 49.4 M37 46.4 L36.7 48.7" stroke="#7fa89e" stroke-width=".9" stroke-linecap="round"/>
  </svg>
  <h1 class="header-brand">FX<span class="tick">&middot;</span>CONVERT</h1>
</header>

<div class="controls">
  <button id="updbtn" class="btn" type="button">Update Rates</button>
  <div class="status" id="statusWrap" role="status">
    <span class="dot busy" id="statusDot" aria-hidden="true"></span>
    <span id="statusText">Waking up the rates desk&hellip;</span>
  </div>
</div>

<main class="stage" id="stage" aria-label="Currency pair carousel" tabindex="0">
  <!-- gem-cut beacon: same matte facet language as the footer heart,
       bobbing gently above whichever card layout() has centred -->
  <div class="beacon" aria-hidden="true">
    <svg class="chevron" width="44" height="42" viewBox="0 0 40 38">
      <defs>
        <linearGradient id="gshC" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#fffbe0"/><stop offset="1" stop-color="#f8c64b"/>

      <polygon points="4,8 20,8 20,30 4,12" fill="#a3417f"/>

  </button>
  <!-- cards injected by script -->
  <button class="nav next" id="nextBtn" type="button" aria-label="Next pair">

<footer>
  <!-- sharply-cut matte heart with a gold spark orbiting its edge -->
  <svg class="gem" width="56" height="52" viewBox="0 0 64 60" aria-hidden="true">
    <defs>
      <linearGradient id="gsh" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#fffbe0"/><stop offset="1" stop-color="#f8c64b"/>
      </linearGradient>
    </defs>
    <!-- silhouette: deepest matte tone shows through as facet seams -->
    <path d="M32 18 L18 4 L6 13 L3 26 L13 40 L32 57 L51 40 L61 26 L58 13 L46 4 Z" fill="#5e1d47"/>
    <!-- facets: flat matte plums, tonal steps only, no gloss -->
    <polygon points="32,18 18,4 6,13 20,28" fill="#a3417f"/>
    <polygon points="32,18 46,4 58,13 44,28" fill="#963a74"/>
    <polygon points="6,13 3,26 13,40 20,28" fill="#ab4684"/>
    <polygon points="58,13 61,26 51,40 44,28" fill="#8e3368"/>
    <polygon points="32,18 20,28 32,46 44,28" fill="#b04e90"/>
    <polygon points="20,28 13,40 32,57 32,46" fill="#9c3d79"/>
    <polygon points="44,28 51,40 32,57 32,46" fill="#8a305f"/>
    <!-- hard-cut outline -->
    <path d="M32 18 L18 4 L6 13 L3 26 L13 40 L32 57 L51 40 L61 26 L58 13 L46 4 Z" fill="none" stroke="#43142f" stroke-width="1.3" stroke-linejoin="miter"/>

         group's own centre equals the heart's centre, then the whole

      <polygon class="spk" style="--td:4.6s" points="32,0 34,2.8 32,5.6 30,2.8" fill="url(#gsh)"/>
      <polygon class="spk" style="--td:3.7s;-webkit-animation-delay:.9s;animation-delay:.9s" points="32,54.4 34,57.2 32,60 30,57.2" fill="url(#gsh)"/>

  <!-- v10.34: the maintainer line gives way to a disclaimer, promoted
       to the top of the footer stack and keeping the 15.5px maint slot;
       the handle moves onto the signature line as plain text (no link),
       carrying its 15.5px rose-light with it; the version stamp rides
       at the end of the line, class and styling unchanged -->
  <!-- v10.35: the ExchangeRate-API credit moves from the tail of the
       privacy line to the very top of the text stack, above the
       disclaimer — size (13px), rose-light colour and href untouched;
       the middot separator goes with it, leaving the privacy line
       to stand alone -->
  <p class="priv"><a href="https://www.exchangerate-api.com" target="_blank" rel="noopener noreferrer" style="color:var(--rose-light);text-decoration:none">Rates By Exchange Rate API</a></p>

  <p class="sig">Made with Proton's Clever Cat (Lumo AI) by <span style="font-size:15.5px;color:var(--rose-light)">cknightshift</span><span class="ver">v10.41</span></p>
  <p class="priv"><a href="https://github.com/cknightshift/fx-convert/blob/main/README.md" target="_blank" rel="noopener noreferrer">Catnip, Disclaimer &amp; Privacy Policy</a></p>
</footer>

<script>
(function(){
'use strict';

/* ===== v10.41 — paste-length cap sized to the honest ceiling =====
   - Outside review flagged the amount field's missing input-length
     limit: a megabyte paste parses into roughly one token object per
     character or two, and millions of small objects are real memory
     pressure on a phone. The narrower claims are overstated — the
     tokenizer and parser are linear (no backtracking regexes;
     parseExpr and parseTerm iterate), a pasted wall of minus signs
     already dies fast in parseFactor's RangeError (logged since
     v10.31), and an oversized number dies honestly at the
     parseFloat/isFinite check. But the token-array buildup on a
     single hostile paste is worth guarding, and the smallest tier
     suffices: one maxlength attribute, no script machinery.
   - The review's suggested 50-character cap is declined: ritual item
     6 settles a 60-digit literal to full plain digits, and fmtPlain's
     BigInt path legitimately writes up to ~309 plain digits plus
     sign (a settled DBL_MAX-scale value expanded exactly) — the
     input/output asymmetry is deliberate and the settle round-trip
     is non-negotiable (anything the app writes must re-parse; HTML
     value sanitization truncates programmatic assignment to
     maxlength too, so a low cap would corrupt the app's own settle).
     The cap is therefore sized to the app's own maximum write:

/* ---------------- safe expression parser ---------------- */
const DIV0 = {div0:true};

function tokenize(src){
  const s = String(src)
    .replace(/\u00d7/g,'*').replace(/[xX]/g,'*')
    .replace(/\u00f7/g,'/').replace(/\u2212/g,'-');
  const toks = [];
  let i = 0;
  while (i < s.length){
    const ch = s[i];
    if (ch === ' ' || ch === '\t'){ i++; continue; }
    if (NUM.test(ch)){
      let j = i;
      while (j < s.length && NUM.test(s[j])) j++;
      const ns = s.slice(i, j);
      if ((ns.match(/\./g) || []).length > 1) throw new Error('malformed number "' + ns + '"');
      const v = parseFloat(ns);
      if (!isFinite(v)) throw new Error('malformed number "' + ns + '"');
      /* a number directly following another number is reachable only
         through intervening whitespace — a thousands-grouping space
         ("1 234.56") — which used to parse as two tokens, fail the
         completeness check, and blank the output with no hint. Reject
         it here so it rides the bad flag and the existing hint */
      if (toks.length && toks[toks.length - 1].t === 'num'){
        throw new Error('space-separated number "' + ns + '"');
      }
      toks.push({t:'num', v}); i = j; continue;
    }
    if (ch === '+' || ch === '-' || ch === '*' || ch === '/'){
      toks.push({t:ch}); i++; continue;
    }
    throw new Error('unexpected character "' + ch + '"');
  }
  return toks;
}

function parseExpr(tk){
  let v = parseTerm(tk);
  while (tk.pos < tk.toks.length && (tk.toks[tk.pos].t === '+' || tk.toks[tk.pos].t === '-')){
    const op = tk.toks[tk.pos].t; tk.pos++;
    const r = parseTerm(tk);
    if (op === '+') v += r; else v -= r;
  }
  return v;
}
function parseTerm(tk){
  let v = parseFactor(tk);
  while (tk.pos < tk.toks.length && (tk.toks[tk.pos].t === '*' || tk.toks[tk.pos].t === '/')){
    const op = tk.toks[tk.pos].t; tk.pos++;
    const r = parseFactor(tk);
    if (op === '*') v *= r;
    else { if (r === 0) throw DIV0; v /= r; }
  }
  return v;
}
function parseFactor(tk){
  const tok = tk.toks[tk.pos];
  if (!tok) throw new Error('incomplete');
  if (tok.t === '-'){ tk.pos++; return -parseFactor(tk); }
  if (tok.t === '+'){ tk.pos++; return parseFactor(tk); }
  if (tok.t === 'num'){ tk.pos++; return tok.v; }
  throw new Error('syntax');
}

/* evaluate -> {ok, value, complete, hasOp, div0, bad, overflow}
   bad = tokenizer rejection (invalid character / malformed number /
   space-separated number): grounds for a gentle hint, unlike a
   still-cooking expression */
function evaluate(src){
  const out = {ok:false, value:NaN, complete:false, hasOp:false, div0:false, bad:false, overflow:false};
  const s = String(src == null ? '' : src).trim();
  if (!s) return out;
  let toks;
  try { toks = tokenize(s); }
  catch(e){ out.bad = true; return out; }
  if (!toks.length) return out;
  /* an operator beyond the lead position makes it a formula; a lone
     unary sign (as in "-5") is just a number and must not auto-settle */
  out.hasOp = toks.some((t, idx) => t.t !== 'num' && idx > 0);
  const ctx = {toks, pos:0};
  try {
    const v = parseExpr(ctx);
    if (ctx.pos !== toks.length) return out; /* trailing operator: incomplete */
    if (!isFinite(v)){
      if (v === Infinity || v === -Infinity) out.overflow = true;
      return out;
    }
    out.ok = true; out.value = v; out.complete = true;
  } catch(e){
    if (e && e.div0) out.div0 = true;
    /* 'incomplete' and 'syntax' are the parser's own control flow —
       parseFactor throws them on every keystroke that leaves a
       trailing or doubled operator while the expression cooks — so
       they must not reach the log. Everything else (a RangeError
       from parseFactor's unary recursion on a pasted wall of minus
       signs, say) used to vanish: output blank, no hint, no trace.
       Log that so the failure is at least diagnosable */
    else if (!(e instanceof Error && (e.message === 'incomplete' || e.message === 'syntax'))){
      console.warn('[FX Convert] evaluate: ' + (e && e.message ? e.message : e));
    }
  }
  return out;
}

/* ---------------- formatting ---------------- */
function fmtPlain(v){
  /* String() slips into exponent form above ~1e21 and below 1e-6,
     and the tokenizer rejects the 'e' — a settled value the app
     itself wrote would resurface as the invalid-character hint.
     Expand to plain digits instead: the 1e-10 rounding step means
     toFixed never rounds a lie into the figure */
  const r = Math.round(v * 1e10) / 1e10;
  /* 1e-10 rounding overflowed; v itself is a finite, integer-valued
     double this big, so BigInt expands it to plain digits exactly */
  if (!isFinite(r)) return String(BigInt(v));
  const s = String(r);
  if (!s.includes('e')) return s;
  /* |r| >= 1 with an 'e' means r >= 1e21, where toFixed() itself
     defers to exponential form; BigInt expands the exact integer
     instead (every double >= 2^52 is integer-valued, so this
     cannot throw) */
  return (Math.abs(r) >= 1) ? String(BigInt(r)) : r.toFixed(10);
}
function fmtMoney(v){
  if (!isFinite(v)) return '';
  if (v === 0) return v.toLocaleString('en-NZ', {maximumFractionDigits: 2});
  /* fraction digits scale down with magnitude: two places from a
     dollar down, four from a cent down, six below that. Maximum
     (not minimum) counts keep tidy results uncluttered. */
  const abs = Math.abs(v);
  const digs = (abs >= 1) ? 2 : (abs >= 0.01 ? 4 : 6);
  let s = v.toLocaleString('en-NZ', {maximumFractionDigits: digs});
  /* honesty guard: if fixed-point rounding still swallowed the
     figure entirely (a nonzero result displaying as "0"), retreat
     to significant digits so something truthful survives — the
     same principle as "Rate unavailable": never show a false zero */
  if (parseFloat(s.replace(/[^0-9.\-]/g, '')) === 0){
    s = v.toLocaleString('en-NZ', {maximumSignificantDigits: 3});
  }
  return s;
}
function hhmm(d){
  const p = n => (n < 10 ? '0' : '') + n;
  return p(d.getHours()) + ':' + p(d.getMinutes());
}

/* ---------------- card construction ---------------- */
const CARD_SVG_CALC =
  '<svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true">' +
    '<rect x="2" y="2" width="16" height="16" rx="3" fill="none" stroke="currentColor" stroke-width="1.6"/>' +
    '<line x1="6" y1="6.5" x2="14" y2="6.5" stroke="currentColor" stroke-width="1.6"/>' +
    '<circle cx="6.5" cy="11" r="1" fill="currentColor"/>' +
    '<circle cx="10" cy="11" r="1" fill="currentColor"/>' +
    '<circle cx="13.5" cy="11" r="1" fill="currentColor"/>' +
    '<circle cx="6.5" cy="14.5" r="1" fill="currentColor"/>' +
    '<circle cx="10" cy="14.5" r="1" fill="currentColor"/>' +
    '<circle cx="13.5" cy="14.5" r="1" fill="currentColor"/>' +
  '</svg>';

function buildCard(pair, opts){
  /* v10.36 — opts is optional. Absent: the legacy [code, name] pair.
     Present with opts.custom: the custom-pairing card, whose two
     currencies arrive as fromCcy/toCcy and live in native selects
     rather than static spans. Native selects buy keyboard support,
     mobile pickers and accessibility without new machinery */
  const isCustom = !!(opts && opts.custom);
  const other = isCustom ? null : pair[0];
  const name  = isCustom ? null : pair[1];
  const fromCcy = isCustom ? (opts.fromCcy || 'USD') : null;
  const toCcy   = isCustom ? (opts.toCcy   || 'NZD') : null;

  const el = document.createElement('article');
  el.className = 'card';

  /* the shared io block; the custom card inserts the same labels,
     with spans the render pass fills — the whole-sale textContent
     writes of the legacy path would destroy them */
  /* v10.39 — the message div is a live region in both card shapes:
     without role="status" a screen reader never hears "Cannot divide
     by zero" or the quieter hints, though .out was already aria-live */
  const ioMarkup =
    '<div class="lbl lbl-in"></div>' +
    '<div class="inrow">' +
      /* v10.41 — paste cap sized for fmtPlain's largest honest write:
         ~309 plain digits (DBL_MAX via BigInt) plus sign, headroom
         above that. Below it nothing; hostile pastes clamp here */
      '<input class="amt" type="text" inputmode="decimal" autocomplete="off" spellcheck="false" maxlength="320" placeholder="0" aria-label="Amount">' +
      '<button class="calc-btn" type="button" aria-label="Calculator">' + CARD_SVG_CALC + '</button>' +
    '</div>' +
    '<div class="calc-msg" role="status" hidden></div>' +
    '<div class="lbl lbl-out" style="margin-top:14px"></div>' +
    '<div class="out" aria-live="polite"></div>';

  if (isCustom){
    el.innerHTML =
      '<div class="pair from"><select class="ccy from-ccy" aria-label="From currency"></select></div>' +
      '<button class="swap" type="button" aria-label="Reverse direction">\u21c4</button>' +
      '<div class="pair to"><select class="ccy to-ccy" aria-label="To currency"></select></div>' +
      '<div class="io">' +
        '<div class="lbl lbl-in">Amount in <span class="x-display"></span></div>' +
        '<div class="inrow">' +
          /* same v10.41 paste cap as the ioMarkup input above, and for
             the same reason — the custom card sets its own markup */
          '<input class="amt" type="text" inputmode="decimal" autocomplete="off" spellcheck="false" maxlength="320" placeholder="0" aria-label="Amount">' +
          '<button class="calc-btn" type="button" aria-label="Calculator">' + CARD_SVG_CALC + '</button>' +
        '</div>' +
        '<div class="calc-msg" role="status" hidden></div>' +
        '<div class="lbl lbl-out" style="margin-top:14px">Converted to <span class="y-display"></span></div>' +
        '<div class="out" aria-live="polite"></div>' +
      '</div>' +
      '<div class="pop-slot"></div>';
  } else {
    el.innerHTML =
      '<div class="pair from"><span class="code"></span><span class="name"></span></div>' +
      '<button class="swap" type="button" aria-label="Reverse direction">\u21c4</button>' +
      '<div class="pair to"><span class="code"></span><span class="name"></span></div>' +
      '<div class="io">' + ioMarkup + '</div>' +
      '<div class="pop-slot"></div>';
  }

  const card = {
    el,
    custom: isCustom,      /* v10.36 — gates the custom code paths */
    other, otherName: name,
    dir: isCustom ? null : 'otherToNzd',  /* source currency is the non-NZD leg */
    rate: null,            /* custom: units of to per from; legacy: NZD per other */
    timer: null,
    fromCcy, toCcy,
    fromSel:  isCustom ? el.querySelector('.from-ccy') : null,
    toSel:    isCustom ? el.querySelector('.to-ccy') : null,
    xDisplay: isCustom ? el.querySelector('.x-display') : null,
    yDisplay: isCustom ? el.querySelector('.y-display') : null,
    fromCode: isCustom ? null : el.querySelector('.pair.from .code'),
    fromName: isCustom ? null : el.querySelector('.pair.from .name'),
    toCode:   isCustom ? null : el.querySelector('.pair.to .code'),
    toName:   isCustom ? null : el.querySelector('.pair.to .name'),
    lblIn:    el.querySelector('.lbl-in'),
    lblOut:   el.querySelector('.lbl-out'),
    amt:      el.querySelector('.amt'),
    msg:      el.querySelector('.calc-msg'),
    out:      el.querySelector('.out'),
    calcBtn:  el.querySelector('.calc-btn'),
    popSlot:  el.querySelector('.pop-slot')
  };

  /* provisional menus so the card is usable the moment it paints;
     applyRates re-cuts them against what the winning source quotes */
  if (isCustom){
    fillCcySelect(card.fromSel, CUSTOM_CURRENCIES, fromCcy);
    fillCcySelect(card.toSel, CUSTOM_CURRENCIES, toCcy);
  }

  el.querySelector('.swap').addEventListener('click', () => {
    closePop(); /* the pad closes on swap, per spec */
    /* a settle timer surviving this click used to fire 1.2 s later
       and, the swap button living in the centred card, containment
       passed and focus yanked to the input mid-interaction. Clearing
       is enough: the typed value carries across the swap and
       updateOutput computes from the raw text, so only the cosmetic
       settle rewrite waits for the next edit */
    if (card.timer){ clearTimeout(card.timer); card.timer = null; }
    if (card.custom){
      /* v10.36 — the custom card's swap trades the two selections;
         the rate must be recomputed here, not left at the previous
         pair's figure */
      const tmp = card.fromCcy;
      card.fromCcy = card.toCcy;
      card.toCcy = tmp;
      recomputeCustom(card);
    } else {
      card.dir = (card.dir === 'otherToNzd') ? 'nzdToOther' : 'otherToNzd';
    }
    render(card);
    updateOutput(card); /* typed value carries across */
  });

  if (isCustom){
    /* v10.36 — a selection change recomputes the rate immediately.
       Menus only offer currencies the serving source quotes, so no
       refresh-on-change dance is needed: an unquotable currency
       simply isn't on the menu */
    /* v10.39 — and it clears the card's pending settle timer, as the
       swap handler has since v10.31: the select lives inside the
       card, so v10.30's containment guard passes and the timer used
       to yank focus out of the select 1.2 s after the change. The
       typed value still carries across and the output still
       recomputes; only the cosmetic settle rewrite waits */
    card.fromSel.addEventListener('change', () => {
      if (card.timer){ clearTimeout(card.timer); card.timer = null; }
      card.fromCcy = card.fromSel.value;
      recomputeCustom(card);
      render(card);
      updateOutput(card);
    });
    card.toSel.addEventListener('change', () => {
      if (card.timer){ clearTimeout(card.timer); card.timer = null; }
      card.toCcy = card.toSel.value;
      recomputeCustom(card);
      render(card);
      updateOutput(card);
    });
    /* ArrowLeft/Right inside a select change the selection natively,
       and the keydown would otherwise bubble to the stage's carousel
       listener and slide the stage mid-selection — the same leak the
       amount input guards against at its text edges, closed here
       for the selects wholesale */
    const stopStageArrows = e => {
      if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') e.stopPropagation();
    };
    card.fromSel.addEventListener('keydown', stopStageArrows);
    card.toSel.addEventListener('keydown', stopStageArrows);
  }

  card.amt.addEventListener('input', () => { onAmountInput(card); });
  card.amt.addEventListener('keydown', e => {
    if (e.key === 'Enter'){ e.preventDefault(); settleNow(card); return; }
    /* arrows keep the caret while it can still move inside the text;
       once parked at an edge they bubble up to the stage's keydown
       and drive the carousel. The edge test must live on keydown
       itself: the carousel listens on keydown, so stopping a later
       keyup (as v10.14 did) still let every arrow both move the
       caret and slide the stage. */
    if (e.key === 'ArrowLeft' || e.key === 'ArrowRight'){
      const len = card.amt.value.length;
      const pos = card.amt.selectionStart;
      if ((e.key === 'ArrowLeft' && pos > 0) ||
          (e.key === 'ArrowRight' && pos < len)) e.stopPropagation();
    }
  });

  card.calcBtn.addEventListener('click', () => { togglePop(card); });
  /* mousedown.preventDefault keeps focus in the input (never steals focus) —
     except on a touch device closing an already-open pad: focus falls away
     from the amount field so the closing tap cannot re-raise the IME */
  card.calcBtn.addEventListener('mousedown', e => {
    if (COARSE && openCard === card && !pop.hidden){ card.amt.blur(); return; }
    e.preventDefault();
  });

  return card;
}

/* draw direction: codes, names, labels, accessible name */
function render(card){
  if (card.custom){
    /* v10.36 — the custom card draws from its two selections. The
       labels are set via their inner spans only: lblIn.textContent
       would destroy the span the next pass tries to fill */
    card.xDisplay.textContent = card.fromCcy;
    card.yDisplay.textContent = card.toCcy;
    card.fromSel.value = card.fromCcy;
    card.toSel.value = card.toCcy;
    card.amt.setAttribute('aria-label', 'Amount in ' + card.fromCcy);
    card.el.setAttribute('aria-label', card.fromCcy + ' to ' + card.toCcy);
    return;
  }
  if (card.dir === 'otherToNzd'){
    card.fromCode.textContent = card.other;  card.fromName.textContent = card.otherName;
    card.toCode.textContent = NZD;           card.toName.textContent = NZD_NAME;
    card.lblIn.textContent = 'Amount in ' + card.other;
    card.lblOut.textContent = 'Converted to ' + NZD;
    card.amt.setAttribute('aria-label', 'Amount in ' + card.other);
    card.el.setAttribute('aria-label', card.other + ' to New Zealand Dollar');
  } else {
    card.fromCode.textContent = NZD;         card.fromName.textContent = NZD_NAME;
    card.toCode.textContent = card.other;    card.toName.textContent = card.otherName;
    card.lblIn.textContent = 'Amount in ' + NZD;
    card.lblOut.textContent = 'Converted to ' + card.other;
    card.amt.setAttribute('aria-label', 'Amount in ' + NZD);
    card.el.setAttribute('aria-label', 'New Zealand Dollar to ' + card.other);
  }
}

/* ---------------- conversion output ---------------- */
function clearOut(card){
  card.out.textContent = '';
  card.out.classList.remove('na');
}
/* returns the evaluation result so callers never re-parse the same text */
function updateOutput(card){
  const raw = card.amt.value;
  const ev = evaluate(raw);
  hideMsg(card);

  if (!raw.trim()){ clearOut(card); return ev; }

  if (ev.div0){ showMsg(card, 'Cannot divide by zero'); clearOut(card); return ev; }
  if (ev.overflow){ showMsg(card, 'Result too large', 'hint'); clearOut(card); return ev; }
  /* quiet guidance for invalid characters: muted tone, never alarm red */
  if (ev.bad){ showMsg(card, 'Numbers and + \u2212 \u00d7 \u00f7 only', 'hint'); clearOut(card); return ev; }
  if (!(ev.ok && ev.complete)){ clearOut(card); return ev; } /* expression still cooking */

  if (card.rate == null){
    if (state == null){
      clearOut(card); /* no figures without live rates */
    } else {
      card.out.textContent = 'Rate unavailable';
      card.out.classList.add('na');
    }
    return ev;
  }
  /* v10.36 — the custom card's rate is units-of-to per unit-of-from,
     so it always multiplies; legacy cards store NZD-per-other and
     divide when the direction flips. Getting this backwards inverts
     every custom conversion */
  const conv = card.custom ? ev.value * card.rate
    : (card.dir === 'otherToNzd') ? ev.value * card.rate : ev.value / card.rate;
  /* finite results at or above 1e21 are computable but display-hostile:
     a wall of digits grows the card and shoves the calculator pad past
     the stage's overflow:hidden edge. 1e21 is where JS itself abandons
     plain notation, and it sits ~8 orders of magnitude above any sane
     conversion. The input still settles to plain digits (fmtPlain is
     untouched); only the output declines to render the figure. */
  if (Math.abs(conv) >= 1e21){ showMsg(card, 'Result too large', 'hint'); clearOut(card); return ev; }
  card.out.textContent = fmtMoney(conv);
  card.out.classList.remove('na');
  return ev;
}

function showMsg(card, text, kind){
  /* v10.39 — unhide before writing: the message div is a live region
     (role="status"), and the text mutation should land in a visible
     region rather than resting on the unhide itself being announced */
  card.msg.hidden = false;
  card.msg.className = 'calc-msg' + (kind ? ' ' + kind : '');
  card.msg.textContent = text;
}
function hideMsg(card){ card.msg.hidden = true; card.msg.textContent = ''; }

/* ---------------- auto-settle after typing an expression ---------------- */
function onAmountInput(card){
  if (card.timer){ clearTimeout(card.timer); card.timer = null; }
  const ev = updateOutput(card); /* one parse feeds both output and settle logic */
  if (ev.ok && ev.complete && ev.hasOp){
    /* hand the settled parse through, so the timer never re-tokenises */
    card.timer = setTimeout(() => settleNow(card, ev), SETTLE_MS);
  }
}

function settleNow(card, ev){
  if (card.timer){ clearTimeout(card.timer); card.timer = null; }
  if (!ev) ev = evaluate(card.amt.value); /* Enter path: parse fresh */
  if (ev.ok && ev.complete && ev.hasOp){
    card.amt.value = fmtPlain(ev.value);
    /* the value settles wherever it lives, but focus only follows
       the centred card: a settle timer surviving carousel travel
       used to yank focus back to a dimmed, off-stage card. Since
       v10.30 a second condition applies, containment: a timer
       surviving a click on a control outside the card (Update
       Rates) must not yank focus back either, so focus reclaims
       only when the card holds document.activeElement. The
       calculator pad lives in the card, so focus there still
       reclaims */
    if (cards[index] === card && card.el.contains(document.activeElement)){
      card.amt.focus();
      try { card.amt.setSelectionRange(card.amt.value.length, card.amt.value.length); } catch(err){}
    }
    updateOutput(card);
  } else if (ev.div0){
    showMsg(card, 'Cannot divide by zero');
  }
}

/* ---------------- calculator popover ---------------- */
const pop = document.createElement('div');
pop.className = 'calc-pop';
pop.hidden = true;
const POP_KEYS = ['+','\u2212','\u00d7','\u00f7','C','\u2713'];
POP_KEYS.forEach(k => {
  const b = document.createElement('button');
  b.type = 'button';
  b.textContent = k;
  b.dataset.k = k; /* delegated handlers below read this */
  if (k === '\u2713'){ b.className = 'ok'; b.setAttribute('aria-label', 'Close calculator'); }
  if (k === 'C'){ b.className = 'cls'; b.setAttribute('aria-label', 'Clear amount'); }
  pop.appendChild(b);
});
let openCard = null;

/* two delegated listeners replace a dozen per-key attachments */
pop.addEventListener('mousedown', e => {
  const b = e.target.closest('button');
  if (!b) return;
  /* ✓ on a touch device closes the pad: drop focus from the amount
     field at mousedown, before the closing tap can be read as
     interaction with a focused editable, so the Android IME stays
     down — the outside-tap close never pops it; this now mirrors it */
  if (COARSE && b.dataset.k === '\u2713'){ if (openCard) openCard.amt.blur(); return; }
  e.preventDefault(); /* focus stays in input */
});
pop.addEventListener('click', e => {
  const b = e.target.closest('button');
  if (b) onPopKey(b.dataset.k, e.detail);
});

function togglePop(card){
  if (openCard === card && !pop.hidden){ closePop(); return; }
  openCard = card;
  card.popSlot.appendChild(pop);
  pop.hidden = false;
  card.amt.focus();
}

function closePop(){
  pop.hidden = true;
  openCard = null;
}

function onPopKey(k, detail){
  const card = openCard;
  if (!card) return;
  const inp = card.amt;
  if (k === 'C'){
    inp.value = '';
    hideMsg(card);
    onAmountInput(card);
    inp.focus();
    return;
  }
  if (k === '\u2713'){
    /* close only: formulas settle by themselves (auto-calc + Enter).
       Refocus only for keyboard activation (detail 0): on touch the
       blur at mousedown has already dropped focus, and restoring it
       here would re-raise the Android IME the user just dismissed */
    closePop();
    if (detail === 0) inp.focus();
    return;
  }
  /* operator insert at caret; the key glyph is already the display form */
  inp.focus();
  const a = (typeof inp.selectionStart === 'number') ? inp.selectionStart : inp.value.length;
  const b = (typeof inp.selectionEnd === 'number') ? inp.selectionEnd : a;
  inp.setRangeText(k, a, b, 'end');
  onAmountInput(card);
}

document.addEventListener('mousedown', e => {
  if (!pop.hidden && openCard){
    if (!pop.contains(e.target) && !openCard.calcBtn.contains(e.target) && !openCard.amt.contains(e.target)) closePop();
  }
});
document.addEventListener('keydown', e => {
  if (!pop.hidden && e.key === 'Escape'){ closePop(); }
});

/* ---------------- carousel ---------------- */
/* card width changes only with the viewport (min(340px,84vw)), so it is
   measured once at boot and again on resize; layout() used to force a
   reflow reading offsetWidth on every carousel step */
let cardW = 300;
function measure(){ cardW = cards.length ? cards[0].el.offsetWidth : 300; }

function layout(){
  const w = stage.clientWidth;
  const GAP = 26;
  const slot = cardW + GAP;
  const n = cards.length;
  /* capture focus before reflow — we may need to restore it */
  const focused = document.activeElement;
  let focusCard = null;
  cards.forEach((card, i) => {
    if (card.el.contains(focused)) focusCard = card;
  });

  cards.forEach((card, i) => {
    let rel = ((i - index) % n + n) % n;
    if (rel > n / 2) rel -= n;
    card.el.style.transform = 'translate(' + (w / 2 + rel * slot - cardW / 2) + 'px, -50%)';
    card.el.style.zIndex = String(10 - Math.abs(rel));
    card.el.style.opacity = (rel === 0) ? '1' : (Math.abs(rel) === 1 ? '.78' : '.45');
    if (rel === 0) card.el.removeAttribute('inert');
    else card.el.setAttribute('inert', '');
  });

  /* if focus was in a card that just went inert, redirect to
     the newly active card's input (or stage as fallback) */
  if (focusCard && focusCard.el.hasAttribute('inert')){
    const active = cards[index];
    if (active && active.amt){ active.amt.focus(); }
    else stage.focus();
  }
}

function go(step){
  closePop(); /* the pad belongs to the card in focus; don't let it ride along */
  const n = cards.length;
  index = ((index + step) % n + n) % n;
  layout();
}

document.getElementById('prevBtn').addEventListener('click', () => { go(-1); });
document.getElementById('nextBtn').addEventListener('click', () => { go(1); });

/* keyboard navigation on the focused stage; arrows pressed inside an
   input are stopped upstream unless the caret is parked at an edge */
stage.addEventListener('keydown', e => {
  if (e.defaultPrevented) return;
  if (e.key === 'ArrowLeft'){ e.preventDefault(); go(-1); }
  else if (e.key === 'ArrowRight'){ e.preventDefault(); go(1); }
});

const reducedMotion = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : null;
function applyRM(){
  if (reducedMotion && reducedMotion.matches) stage.classList.add('rm');
  else stage.classList.remove('rm');
}
if (reducedMotion && reducedMotion.addEventListener) reducedMotion.addEventListener('change', applyRM);

let resizeTimer = null;
window.addEventListener('resize', () => {
  stage.classList.remove('armed'); /* no decorative slide while resizing */
  measure();
  layout();
  if (resizeTimer) clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    requestAnimationFrame(() => requestAnimationFrame(() => stage.classList.add('armed')));
  }, 120);
});

/* ---------------- rates: fetch, fallback, bounds ---------------- */
function fetchJSON(url, timeoutMs){
  return new Promise((resolve, reject) => {
    let settled = false;
    const ctl = ('AbortController' in window) ? new AbortController() : null;
    /* single settle point: clears the timer and guarantees a one-shot
       resolve/reject, replacing three copies of the same bookkeeping */
    const timer = setTimeout(() => {
      if (ctl) ctl.abort();
      finish(reject, new Error('timeout after ' + timeoutMs + 'ms'));
    }, timeoutMs);
    function finish(fn, arg){
      if (settled) return;
      settled = true;
      clearTimeout(timer);
      fn(arg);
    }
    /* v10.38 — no-store keeps the "Live rates" label honest: the
       HTTP cache could otherwise serve a stale response as fresh,
       and it would mask the offline rehearsal's expected failure.
       Same two allow-listed hosts, same keyless GETs; only
       freshness is asserted */
    fetch(url, ctl ? {signal: ctl.signal, cache: 'no-store'} : {cache: 'no-store'})
      .then(r => {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      })
      .then(j => finish(resolve, j))
      .catch(err => finish(reject, err));
  });
}

function looksLikeErApi(j){ return j && j.result === 'success' && typeof j.base_code === 'string' && j.rates && typeof j.rates === 'object'; }
/* v2 serves a flat array of {date, base, quote, rate} rows rather
   than v1's {base, rates:{}} map */
function looksLikeFrankV2(j){
  return Array.isArray(j) && j.length > 0 && j.every(r =>
    r && typeof r === 'object' &&
    typeof r.base === 'string' && typeof r.quote === 'string'
  );
}

/* v10.36 — generalized cross-rate: units of `to` per unit of `from`,
   via the same quotient-of-per-base algebra the NZD-specific form
   used (legacy cards pass (other, NZD), which reduces to exactly
   the old computation). Null when either leg is unquotable or the
   ratio falls outside the sanity bounds — never a substituted
   figure */
function computeCrossRate(rates, base, from, to){
  /* a source never quotes its own base currency, so read the declared
     base as 1; without this, EUR/NZD went dark whenever the EUR-based
     Frankfurter fallback served the rates */
  const f = (from === base) ? 1 : rates[from];
  const t = (to === base) ? 1 : rates[to];
  if (typeof f !== 'number' || typeof t !== 'number'){
    console.warn('[FX Convert] ' + from + '/' + to + ': source ' + base + ' is missing a quote for the pair (' + from + '=' + f + ', ' + to + '=' + t + '); marking pair unavailable.');
    return null;
  }
  const rate = t / f;
  if (!(rate >= BOUND_LO && rate <= BOUND_HI)){
    console.warn('[FX Convert] ' + from + '/' + to + ' = ' + rate.toFixed(6) + ' falls outside sanity bounds ' + BOUND_LO + '\u2013' + BOUND_HI + '; marking pair unavailable.');
    return null;
  }
  return rate;
}

function applyRates(rates, base, label, when){
  state = {base, rates, label};
  /* the menu rebuild runs first: it may snap the custom card's
     selections to codes the source actually quotes, and the rate
     computed below must reflect the snapped pair, not the pre-snap
     one. Placement against real execution order, per the
     cautionary trail */
  refreshCustomMenu(rates, base);
  cards.forEach(card => {
    card.rate = card.custom
      ? computeCrossRate(rates, base, card.fromCcy, card.toCcy)
      : computeCrossRate(rates, base, card.other, NZD);
    updateOutput(card);
  });
  setStatus('Live rates via ' + label + ' \u00b7 ' + hhmm(when), 'live');
}

/* v10.36 — rebuild the custom card's two menus against what this
   source actually quotes (the curated pool, intersected), preserving
   current selections where they survive and snapping to sensible
   defaults where they don't. Under the primary this is the full
   curated set; under the fallback it narrows to the quoted codes —
   a recorded known limit, honest rather than broken: an unquotable
   currency simply isn't offered */
function refreshCustomMenu(rates, base){
  const c = cards.find(k => k.custom);
  if (!c || !c.fromSel || !c.toSel) return;
  const menu = CUSTOM_CURRENCIES.filter(code =>
    code === base || typeof rates[code] === 'number');
  if (!menu.length) return;
  if (!menu.includes(c.fromCcy)) c.fromCcy = menu[0];
  if (!menu.includes(c.toCcy)) c.toCcy = menu.includes(NZD) ? NZD : menu[0];
  fillCcySelect(c.fromSel, menu, c.fromCcy);
  fillCcySelect(c.toSel, menu, c.toCcy);
  render(c);
}

/* v10.36 — fill one currency select from a code list, showing
   "CODE — Name" so the picker teaches while it offers */
/* v10.40 — one disabled, valueless "here kitty kitty" option
   separates the featured pairs from the alphabetical remainder:
   drawn before the first code outside the featured set, and only
   when both sides of it survive the menu cut — a separator pinned
   to the top or tail of a cut menu is clutter, not structure (the
   filter in refreshCustomMenu preserves the pool's featured-first
   order, so the head is always a prefix). Disabled keeps it
   unpickable and skipped by keyboard navigation, and the value
   assignment below matches codes, so the selection can never land
   on it (a disabled option is never matched) */
function fillCcySelect(sel, menu, val){
  sel.innerHTML = '';
  const restStart = menu.findIndex(code => !FEATURED_CURRENCIES.includes(code));
  menu.forEach((code, i) => {
    if (i === restStart && restStart > 0){
      const sep = document.createElement('option');
      sep.disabled = true;
      sep.textContent = 'here kitty kitty';
      sel.appendChild(sep);
    }
    const opt = document.createElement('option');
    opt.value = code;
    opt.textContent = code + ' \u2014 ' + (CURRENCY_NAMES[code] || code);
    sel.appendChild(opt);
  });
  sel.value = val;
}

/* v10.36 — recompute the custom card's rate from the live state.
   card.rate only refreshes in applyRates otherwise, so selection
   changes and swaps would have displayed the previous pair's
   figure */
function recomputeCustom(card){
  card.rate = state ? computeCrossRate(state.rates, state.base, card.fromCcy, card.toCcy) : null;
}

function failAll(reason){
  state = null;
  cards.forEach(card => {
    card.rate = null;
    updateOutput(card); /* outputs clear; inputs stay editable */
  });
  setStatus('Rates unavailable \u2014 tap Update Rates to retry', 'bad');
  console.warn('[FX Convert] Both rate sources failed. ' + reason);
}

function refreshRates(){
  if (busy) return; /* no parallel-fetch races */
  busy = true;
  updBtn.disabled = true;
  updBtn.textContent = 'Updating\u2026';
  setStatus('Fetching live rates\u2026', 'busy');

  /* v10.36 — the fallback URL carries the custom card's current
     selections alongside the legacy pairs, so exotic legs stay
     quotable when Frankfurter serves. Built once per attempt from
     the selections as they stand when the refresh begins */
  const custom = cards.find(c => c.custom);
  const dynFallbackUrl = getFallbackUrl(
    custom && custom.fromSel ? custom.fromSel.value : null,
    custom && custom.toSel ? custom.toSel.value : null);

  fetchJSON(PRIMARY_URL, PRIMARY_MS)
    .then(j => {
      if (!looksLikeErApi(j)) throw new Error('primary response malformed');
      return {rates: j.rates, base: j.base_code, label: 'open.er-api.com'};
    })
    .catch(err => {
      console.warn('[FX Convert] Primary source (open.er-api.com) failed: ' + err.message);
      return fetchJSON(dynFallbackUrl, FALLBACK_MS).then(j2 => {
        if (!looksLikeFrankV2(j2)) throw new Error('fallback response malformed');
        /* every row must declare the same base, and it must be the base
           we asked for: a deviation breaks the request's contract (EUR
           is excluded from the quotes for being the base), so refuse
           loudly rather than trust a reshaped response */
        const rowsBase = j2[0].base;
        if (rowsBase !== FALLBACK_BASE || j2.some(r => r.base !== rowsBase)){
          throw new Error('fallback base mismatch: expected ' + FALLBACK_BASE + ', rows declare ' + rowsBase);
        }
        const rates = {};
        let skipped = 0;
        j2.forEach(r => {
          if (typeof r.rate === 'number' && isFinite(r.rate)) rates[r.quote] = r.rate;
          else skipped++;
        });
        if (skipped > 0) console.warn('[FX Convert] Frankfurter v2 skipped ' + skipped + ' malformed rate row(s).');
        return {rates: rates, base: rowsBase, label: 'frankfurter.dev'};
      });
    })
    .then(win => applyRates(win.rates, win.base, win.label, new Date()))
    .catch(err => failAll(err.message))
    .then(() => {
      busy = false;
      updBtn.disabled = false;
      updBtn.textContent = 'Update Rates';
    });
}

updBtn.addEventListener('click', refreshRates);

/* ---------------- boot ---------------- */
/* v10.37 — custom card leads the carousel, so it greets the user
   on load. The fixed USD→NZD pair is now its default, making that
   hardcoded card redundant. Four legacy pairs follow */
const customCard = buildCard(null, {custom: true, fromCcy: 'USD', toCcy: NZD});
cards.push(customCard);
render(customCard);
stage.insertBefore(customCard.el, document.getElementById('nextBtn'));

PAIRS.forEach(p => {
  const card = buildCard(p);
  cards.push(card);
  render(card);
  stage.insertBefore(card.el, document.getElementById('nextBtn'));
});

applyRM();
measure();
layout();
/* arm transitions only after first paint, so opening the page never animates */
requestAnimationFrame(() => requestAnimationFrame(() => stage.classList.add('armed')));

refreshRates();

})();
</script>
</body>
</html>
